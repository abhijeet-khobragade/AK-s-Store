<div class="min-h-screen flex items-center justify-center bg-gray-100 px-4">
    <mat-card class="w-full max-w-md p-6">
        <h1 class="text-2xl font-bold text-center mb-1">Welcome back</h1>
        <p class="text-center text-gray-500 mb-6">Sign in to AK's Store</p>

        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="flex flex-col gap-2">
            <mat-form-field appearance="outline">
                <mat-label>Email</mat-label>
                <input matInput type="email" formControlName="email" autocomplete="email">
                <mat-icon matSuffix>email</mat-icon>
                <mat-error *ngIf="loginForm.controls.email.hasError('required')">Email is required</mat-error>
                <mat-error *ngIf="loginForm.controls.email.hasError('email')">Enter a valid email</mat-error>
            </mat-form-field>

            <mat-form-field appearance="outline">
                <mat-label>Password</mat-label>
                <input matInput [type]="hidePassword ? 'password' : 'text'" formControlName="password" autocomplete="current-password">
                <button mat-icon-button matSuffix type="button" (click)="hidePassword = !hidePassword"
                    [attr.aria-label]="hidePassword ? 'Show password' : 'Hide password'">
                    <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
                </button>
                <mat-error *ngIf="loginForm.controls.password.hasError('required')">Password is required</mat-error>
                <mat-error *ngIf="loginForm.controls.password.hasError('minlength')">Password must be at least 6 characters</mat-error>
            </mat-form-field>

            <p *ngIf="error" class="text-rose-600 text-sm">{{ error }}</p>

            <button mat-flat-button type="submit" class="w-full mt-2" [disabled]="loading">
                {{ loading ? 'Logging in...' : 'Login' }}
            </button>
        </form>

        <p class="text-center text-sm text-gray-600 mt-6">
            Don't have an account?
            <a routerLink="/signup" class="text-blue-600 font-medium hover:underline">Sign up</a>
        </p>
    </mat-card>
</div>
