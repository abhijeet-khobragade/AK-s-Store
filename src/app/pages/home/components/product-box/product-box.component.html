<mat-card class="h-full overflow-hidden transition-shadow hover:shadow-lg">
    <div class="h-full flex" [ngClass]="fullWidthMode ? 'flex-col sm:flex-row' : 'flex-col'">
        <div class="bg-gray-50 flex items-center justify-center p-4" [ngClass]="{ 'sm:w-64 shrink-0': fullWidthMode }">
            <img [src]="product.image" [alt]="product.title" loading="lazy" class="h-48 w-full object-contain">
        </div>

        <div class="flex flex-col flex-1 gap-1 p-4">
            <span class="text-xs font-medium uppercase tracking-wide text-gray-500">{{ product.category }}</span>
            <h3 class="font-medium leading-snug line-clamp-2" [title]="product.title">{{ product.title }}</h3>
            <p *ngIf="fullWidthMode" class="text-sm text-gray-600 line-clamp-3 mt-1">{{ product.description }}</p>

            <div class="mt-auto pt-3 flex items-center justify-between gap-2">
                <span class="text-lg font-semibold">{{ product.price | currency }}</span>
                <button mat-flat-button (click)="onAddToCart()" [attr.aria-label]="'Add ' + product.title + ' to cart'">
                    <mat-icon>add_shopping_cart</mat-icon>
                    Add
                </button>
            </div>
        </div>
    </div>
</mat-card>
